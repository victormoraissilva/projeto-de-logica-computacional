<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <title>Mini Luta JS</title>
    <style>
        body { margin: 0; background: #222; display: flex; justify-content: center; align-items: center; height: 100vh; color: white; font-family: sans-serif; overflow: hidden; }
        canvas { border: 4px solid #fff; background: #333; }
        .ui { position: absolute; top: 20px; display: flex; width: 800px; justify-content: space-between; padding: 0 20px; box-sizing: border-box; }
        .health-bar { width: 300px; height: 20px; background: red; border: 2px solid #fff; }
        .health-fill { width: 100%; height: 100%; background: #4cf500; transition: width 0.2s; }
    </style>
</head>
<body>

    <div class="ui">
        <div class="health-bar"><div id="p1-health" class="health-fill"></div></div>
        <div class="health-bar"><div id="p2-health" class="health-fill"></div></div>
    </div>
    <canvas id="gameCanvas"></canvas>

    <script>
        const canvas = document.getElementById('gameCanvas');
        const ctx = canvas.getContext('2d');

        canvas.width = 800;
        canvas.height = 400;

        const gravity = 0.7;

        class Player {
            constructor({ position, color, keys, offset }) {
                this.position = position;
                this.velocity = { x: 0, y: 0 };
                this.width = 50;
                this.height = 100;
                this.color = color;
                this.health = 100;
                this.isAttacking = false;
                this.keys = keys;
                this.attackBox = { position: { x: this.position.x, y: this.position.y }, offset, width: 100, height: 50 };
            }

            draw() {
                // Desenha Jogador
                ctx.fillStyle = this.color;
                ctx.fillRect(this.position.x, this.position.y, this.width, this.height);

                // Desenha Ataque (quando atacando)
                if (this.isAttacking) {
                    ctx.fillStyle = 'white';
                    ctx.fillRect(this.attackBox.position.x, this.attackBox.position.y, this.attackBox.width, this.attackBox.height);
                }
            }

            update() {
                this.draw();
                this.attackBox.position.x = this.position.x + this.attackBox.offset.x;
                this.attackBox.position.y = this.position.y;

                this.position.x += this.velocity.x;
                this.position.y += this.velocity.y;

                // Lógica de Gravidade
                if (this.position.y + this.height + this.velocity.y >= canvas.height) {
                    this.velocity.y = 0;
                } else {
                    this.velocity.y += gravity;
                }
            }

            attack() {
                this.isAttacking = true;
                setTimeout(() => { this.isAttacking = false; }, 100);
            }
        }

        const player1 = new Player({
            position: { x: 100, y: 0 },
            color: '#3498db',
            offset: { x: 0, y: 0 }
        });

        const player2 = new Player({
            position: { x: 650, y: 0 },
            color: '#e74c3c',
            offset: { x: -50, y: 0 }
        });

        const keys = {
            a: false, d: false, w: false, space: false,
            ArrowLeft: false, ArrowRight: false, ArrowUp: false, Enter: false
        };

        window.addEventListener('keydown', (e) => {
            if (e.key === ' ') player1.attack();
            if (e.key === 'Enter') player2.attack();
            if (keys.hasOwnProperty(e.key) || e.code === 'Space') {
                keys[e.key === ' ' ? 'space' : e.key] = true;
            }
        });

        window.addEventListener('keyup', (e) => {
            if (keys.hasOwnProperty(e.key) || e.code === 'Space') {
                keys[e.key === ' ' ? 'space' : e.key] = false;
            }
        });

        function checkCollision(rect1, rect2) {
            return (
                rect1.attackBox.position.x < rect2.position.x + rect2.width &&
                rect1.attackBox.position.x + rect1.attackBox.width > rect2.position.x &&
                rect1.attackBox.position.y < rect2.position.y + rect2.height &&
                rect1.attackBox.position.y + rect1.attackBox.height > rect2.position.y
            );
        }

        function animate() {
            window.requestAnimationFrame(animate);
            ctx.fillStyle = '#333';
            ctx.fillRect(0, 0, canvas.width, canvas.height);

            player1.update();
            player2.update();

            // Movimento P1
            player1.velocity.x = 0;
            if (keys.a) player1.velocity.x = -5;
            if (keys.d) player1.velocity.x = 5;
            if (keys.w && player1.position.y + player1.height >= canvas.height) player1.velocity.y = -15;

            // Movimento P2
            player2.velocity.x = 0;
            if (keys.ArrowLeft) player2.velocity.x = -5;
            if (keys.ArrowRight) player2.velocity.x = 5;
            if (keys.ArrowUp && player2.position.y + player2.height >= canvas.height) player2.velocity.y = -15;

            // Detectar Colisão de Ataque
            if (player1.isAttacking && checkCollision(player1, player2)) {
                player1.isAttacking = false;
                player2.health -= 10;
                document.getElementById('p2-health').style.width = player2.health + '%';
            }

            if (player2.isAttacking && checkCollision(player2, player1)) {
                player2.isAttacking = false;
                player1.health -= 10;
                document.getElementById('p1-health').style.width = player1.health + '%';
            }

            // Fim de Jogo
            if (player1.health <= 0 || player2.health <= 0) {
                ctx.fillStyle = 'white';
                ctx.font = '40px Arial';
                ctx.fillText('FIM DE JOGO!', 300, 200);
            }
        }

        animate();
    </script>
</body>
</html>
